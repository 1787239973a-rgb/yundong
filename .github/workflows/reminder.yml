name: Daily Posture Reminder
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send reminder
        env:
          TZ: Asia/Shanghai
          PUSH_TOKEN: ${{ secrets.PUSH_KEY }}
        run: node scripts/reminder.js
